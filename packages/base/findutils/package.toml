[package]
name = "findutils"
version = "4.10.0"
release = 1
description = "GNU directory searching utilities"
[source]
url = "https://ftp.gnu.org/gnu/findutils/findutils-4.10.0.tar.xz"
sha256 = "1387e0b67ff247d2abde998f90dfbf70c1491391a59ddfecb8ae698789f0a4f5"
[build]
system = "autotools"
configure_args = ["--disable-nls", "--without-selinux"]
[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
