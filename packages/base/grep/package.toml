[package]
name = "grep"
version = "3.12"
release = 1
description = "GNU pattern matching utilities"
[source]
url = "https://ftp.gnu.org/gnu/grep/grep-3.12.tar.xz"
sha256 = "2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9"
[build]
system = "autotools"
configure_args = ["--disable-nls", "--without-included-regex"]
[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
