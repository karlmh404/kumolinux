[package]
name = "bash"
version = "5.3"
release = 1
description = "GNU Bourne Again Shell"
[source]
url = "https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz"
sha256 = "0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba"
[build]
system = "autotools"
configure_args = ["--without-bash-malloc", "--disable-nls", "--with-installed-readline=no"]
[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
