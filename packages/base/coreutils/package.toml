[package]
name = "coreutils"
version = "9.8"
release = 1
description = "GNU core utilities"
[source]
url = "https://ftp.gnu.org/gnu/coreutils/coreutils-9.8.tar.xz"
sha256 = "e6d4fd2d852c9141a1c2a18a13d146a0cd7e45195f72293a4e4c044ec6ccca15"
[build]
system = "autotools"
patches = ["glibc-2.44-const-generic.patch"]
configure_args = ["--disable-nls", "--enable-no-install-program=kill,uptime"]
[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
