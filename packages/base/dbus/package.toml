[package]
name = "dbus"
version = "1.16.2"
release = 1
description = "System message bus"
[source]
url = "https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz"
filename = "dbus-1.16.2.tar.xz"
sha256 = "0ba2a1a4b16afe7bceb2c07e9ce99a8c2c3508e5dec290dbb643384bd6beb7e2"
[build]
system = "meson"
configure_args = ["-Dmessage_bus=true", "-Dsystemd=enabled", "-Dsystemd_system_unitdir=/usr/lib/systemd/system", "-Dsystemd_user_unitdir=/usr/lib/systemd/user", "-Ddbus_user=messagebus", "-Duser_session=false", "-Dmodular_tests=disabled", "-Dinstalled_tests=false", "-Dxml_docs=disabled", "-Ddoxygen_docs=disabled", "-Dducktype_docs=disabled", "-Dqt_help=disabled", "-Dapparmor=disabled", "-Dselinux=disabled", "-Dlibaudit=disabled", "-Dx11_autolaunch=disabled", "-Dlaunchd=disabled", "-Dstats=false"]
[dependencies]
build = ["glibc-runtime", "expat", "systemd"]
runtime = ["glibc-runtime", "expat", "systemd"]
