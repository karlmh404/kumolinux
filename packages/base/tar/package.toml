[package]
name = "tar"
version = "1.35"
release = 1
description = "GNU tar archiver"
[source]
url = "https://ftp.gnu.org/gnu/tar/tar-1.35.tar.xz"
sha256 = "4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16"
[build]
system = "autotools"
configure_args = ["--disable-nls", "--without-selinux", "--without-posix-acls"]
[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
