[package]
name = "libdrm"
version = "2.4.124"
release = 1
description = "Userspace interface to kernel DRM services"

[source]
url = "https://dri.freedesktop.org/libdrm/libdrm-2.4.124.tar.xz"
sha256 = "ac36293f61ca4aafaf4b16a2a7afff312aa4f5c37c9fbd797de9e3c0863ca379"

[build]
system = "meson"
configure_args = [
  "-Dintel=disabled",
  "-Dradeon=disabled",
  "-Damdgpu=disabled",
  "-Dnouveau=disabled",
  "-Dvmwgfx=disabled",
  "-Dfreedreno=disabled",
  "-Dvc4=disabled",
  "-Detnaviv=disabled",
  "-Dcairo-tests=disabled",
  "-Dman-pages=disabled",
  "-Dvalgrind=disabled",
  "-Dtests=false",
  "-Dudev=false"
]

[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
