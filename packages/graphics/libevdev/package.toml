[package]
name = "libevdev"
version = "1.13.3"
release = 1
description = "Wrapper library for kernel evdev devices"

[source]
url = "https://www.freedesktop.org/software/libevdev/libevdev-1.13.3.tar.xz"
sha256 = "abf1aace86208eebdd5d3550ffded4c8d73bb405b796d51c389c9d0604cbcfbf"

[build]
system = "meson"
configure_args = [
  "-Dtests=disabled",
  "-Ddocumentation=disabled",
  "-Dtools=disabled"
]

[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
