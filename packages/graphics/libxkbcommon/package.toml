[package]
name = "libxkbcommon"
version = "1.7.0"
release = 1
description = "Keyboard keymap compiler and support library"

[source]
url = "https://xkbcommon.org/download/libxkbcommon-1.7.0.tar.xz"
sha256 = "65782f0a10a4b455af9c6baab7040e2f537520caa2ec2092805cdfd36863b247"

[build]
system = "meson"
patches = ["0001-install-xkb-data.patch"]
configure_args = [
  "-Denable-x11=false",
  "-Denable-docs=false",
  "-Denable-wayland=false",
  "-Denable-xkbregistry=false",
  "-Denable-tools=false",
  "-Denable-bash-completion=false",
  "-Dxkb-config-root=/usr/share/X11/xkb",
  "-Dxkb-config-extra-path=/etc/xkb"
]

[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
