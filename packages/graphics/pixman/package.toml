[package]
name = "pixman"
version = "0.44.2"
release = 1
description = "Low-level pixel manipulation library"

[source]
url = "https://cairographics.org/releases/pixman-0.44.2.tar.gz"
sha256 = "6349061ce1a338ab6952b92194d1b0377472244208d47ff25bef86fc71973466"

[build]
system = "meson"
configure_args = [
  "-Dgtk=disabled",
  "-Dlibpng=disabled",
  "-Dtests=disabled",
  "-Ddemos=disabled",
  "-Dopenmp=disabled"
]

[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
