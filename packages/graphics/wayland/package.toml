[package]
name = "wayland"
version = "1.23.1"
release = 1
description = "Core Wayland display server and client libraries"

[source]
url = "https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.23.1/downloads/wayland-1.23.1.tar.xz"
sha256 = "864fb2a8399e2d0ec39d56e9d9b753c093775beadc6022ce81f441929a81e5ed"

[build]
system = "meson"
configure_args = [
  "-Ddocumentation=false",
  "-Dtests=false",
  "-Ddtd_validation=false",
  "-Dlibraries=true",
  "-Dscanner=true"
]

[dependencies]
build = ["glibc-runtime", "libffi", "expat"]
runtime = ["glibc-runtime", "libffi", "expat"]
