[package]
name = "expat"
version = "2.10.0"
release = 1
description = "XML parser library"
[source]
url = "https://github.com/libexpat/libexpat/releases/download/R_2_10_0/expat-2.10.0.tar.xz"
filename = "expat-2.10.0.tar.xz"
sha256 = "c624ba2998fc65df1163a49641ff3f9ab73138b11641d92c86bee0fb01b1bc7f"
[build]
system = "autotools"
configure_args = ["--disable-static", "--without-xmlwf", "--without-examples", "--without-tests", "--without-docbook"]
[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
