[package]
name = "tomlplusplus"
version = "3.4.0"
release = 1
description = "Header-only TOML parser for C++"

[source]
url = "https://github.com/marzer/tomlplusplus/archive/refs/tags/v3.4.0.tar.gz"
filename = "tomlplusplus-3.4.0.tar.gz"
sha256 = "8517f65938a4faae9ccf8ebb36631a38c1cadfb5efa85d9a72e15b9e97d25155"

[build]
system = "cmake"
patches = ["0001-pkgconfig.patch"]
configure_args = ["-DTOMLPLUSPLUS_BUILD_TESTS=OFF", "-DTOMLPLUSPLUS_BUILD_EXAMPLES=OFF"]

[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
