[package]
name = "libpng"
version = "1.6.44"
release = 1
description = "Official PNG reference library"

[source]
url = "https://downloads.sourceforge.net/project/libpng/libpng16/1.6.44/libpng-1.6.44.tar.xz"
sha256 = "60c4da1d5b7f0aa8d158da48e8f8afa9773c1c8baa5d21974df61f1886b8ce8e"

[build]
system = "autotools"
configure_args = ["--disable-static"]

[dependencies]
build = ["glibc-runtime", "zlib"]
runtime = ["glibc-runtime", "zlib"]
