[package]
name = "libxcrypt"
version = "4.4.38"
release = 1
description = "Extended crypt library"
[source]
url = "https://github.com/besser82/libxcrypt/releases/download/v4.4.38/libxcrypt-4.4.38.tar.xz"
sha256 = "80304b9c306ea799327f01d9a7549bdb28317789182631f1b54f4511b4206dd6"
[build]
system = "autotools"
configure_args = ["--disable-static", "--disable-obsolete-api", "--disable-werror", "--enable-hashes=strong,glibc"]
[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
