[package]
name = "libffi"
version = "3.4.7"
release = 1
description = "A portable foreign function interface library"

[source]
url = "https://github.com/libffi/libffi/releases/download/v3.4.7/libffi-3.4.7.tar.gz"
sha256 = "138607dee268bdecf374adf9144c00e839e38541f75f24a1fcf18b78fda48b2d"

[build]
system = "autotools"
configure_args = ["--disable-static", "--disable-docs"]

[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
