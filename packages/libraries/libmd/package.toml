[package]
name = "libmd"
version = "1.1.0"
release = 1
description = "Message digest functions from BSD systems"

[source]
url = "https://github.com/libmd/libmd/releases/download/1.1.0/libmd-1.1.0.tar.xz"
filename = "libmd-1.1.0.tar.xz"
sha256 = "1bd6aa42275313af3141c7cf2e5b964e8b1fd488025caf2f971f43b00776b332"

[build]
system = "autotools"
configure_args = ["--disable-nls", "--disable-static"]

[dependencies]
build = ["glibc-runtime"]
runtime = ["glibc-runtime"]
