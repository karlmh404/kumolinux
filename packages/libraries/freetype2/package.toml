[package]
name = "freetype2"
version = "2.13.2"
release = 1
description = "FreeType 2 font engine"

[source]
url = "https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.xz"
filename = "freetype-2.13.2.tar.xz"
sha256 = "12991c4e55c506dd7f9b765933e62fd2be2e06d421505d7950a132e4f1bb484d"

[build]
system = "autotools"
configure_args = ["--disable-nls", "--disable-static", "--with-harfbuzz=no", "--with-bzip2=no", "--with-png=no", "--with-zlib=yes"]

[dependencies]
build = ["glibc-runtime", "zlib"]
runtime = ["glibc-runtime", "zlib"]
