[package]
name = "mist"
version = "0.1.0"
release = 3
description = "Mist Desktop Environment — Kumo Linux graphical shell (Hyprland + Qt Quick shell)"

[source]
local = true
url = "local"

[build]
system = "custom"
script = "build.sh"

[dependencies]
build = ["glibc-runtime", "hyprland", "qtbase", "qtdeclarative", "qtwayland", "quickshell", "hyprlock", "hyprpaper"]
runtime = ["glibc-runtime", "hyprland", "qtbase", "qtdeclarative", "qtwayland", "quickshell", "hyprlock", "hyprpaper"]
