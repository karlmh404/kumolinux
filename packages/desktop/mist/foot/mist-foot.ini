# foot — Mist terminal theme (Kumo Linux)
# Mist palette:
#   midnight slate #1e293b  (background)
#   soft blue-gray #64748b  (secondary)
#   misty white    #f8fafc  (foreground)
#   sky blue       #38bdf8  (accent)
#   muted lavender #a78bfa  (secondary accent)

[window]
width_chars = 100
height_lines = 30
padding = 14
opacity = 0.94
decorations = none
title = "foot — Kumo Mist"
title-live = false

[scrollback]
multiplier = 1

[cursor]
shape = block
blink = off
color = 0x38bdf8

[search]
regex = off
case-sensitive = smart
wrap = on

[selection]
clipboard = primary+selection+cc

[mouse]
url-launcher = xdg-open
double-click = word
triple-click = line
quadruple-click = paragraph

[kbd]
rate = 25
delay = 300

[keys]
bind = control+shift, plus, action, "increase-font-size(1)"
bind = control+shift, minus, action, "decrease-font-size(1)"
bind = control+shift, zero, action, "reset-font-size"
bind = control+shift, c, action, "copy-to-clipboard"
bind = control+shift, v, action, "paste-from-clipboard"
bind = control+shift, n, action, "new-window"
bind = f11, action, "toggle-fullscreen"

[colors]
black = 0x1e293b
red = 0xf87171
green = 0x4ade80
yellow = 0xfbbf24
blue = 0x38bdf8
magenta = 0xa78bfa
cyan = 0x22d3ee
white = 0xf8fafc

bright-black = 0x64748b
bright-red = 0xfca5a5
bright-green = 0x86efac
bright-yellow = 0xfcd34d
bright-blue = 0x7dd3fc
bright-magenta = 0xc4b5fd
bright-cyan = 0x67e8f9
bright-white = 0xffffff

background = 0x1e293b
foreground = 0xf8fafc
cursor = 0x38bdf8

[font]
normal = DejaVu Sans Mono:size=11:style=Book
bold = DejaVu Sans Mono:size=11:style=Bold
italic = DejaVu Sans Mono:size=11:style=Oblique
bold-italic = DejaVu Sans Mono:size=11:style=Bold Oblique
emoji = Noto Color Emoji:size=11
