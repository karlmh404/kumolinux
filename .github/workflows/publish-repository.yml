name: Publish Kumo package repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag containing the .kpkg assets
        required: true
        default: kumo-0.0.2
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kumo-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Install zstd
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd
      - name: Download release package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p out/packages
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.kpkg' \
            --dir out/packages
          mkdir -p out/signed-metadata
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'snapshot.toml' \
            --pattern 'snapshot.toml.sig' \
            --dir out/signed-metadata
      - name: Build static stable repository
        run: |
          test -n "$(find out/packages -maxdepth 1 -type f -name '*.kpkg' -print -quit)"
          ./tools/kumo-repo build --channel stable --arch x86_64 out/public-repo
          repository=out/public-repo/stable/x86_64
          cp out/signed-metadata/snapshot.toml "$repository/"
          cp out/signed-metadata/snapshot.toml.sig "$repository/"
          public_key="$(find rootfs/base-overlay/usr/share/kumo/keys -maxdepth 1 -type f -name '*.pub' -print -quit)"
          test -n "$public_key"
          ./tools/kumo-sign verify --repository "$repository" --public-key "$public_key"
          mkdir -p _site/kumo
          cp -a out/public-repo/stable _site/kumo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
