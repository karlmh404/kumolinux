name: Publish Kumo package repository

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kumo-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Install zstd
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd
      - name: Download release package artifacts
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/packages
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.kpkg' \
            --dir out/packages
      - name: Build static stable repository
        run: |
          test -n "$(find out/packages -maxdepth 1 -type f -name '*.kpkg' -print -quit)"
          ./tools/kumo-repo build --channel stable --arch x86_64 out/public-repo
          mkdir -p _site/kumo
          cp -a out/public-repo/stable _site/kumo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
